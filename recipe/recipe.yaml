schema_version: 1

context:
  name: nomad-schema-plugin-run
  version: "1.0.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_schema_plugin_run-${{ version }}.tar.gz
  sha256: 469ac3717fb36776bce76ce86782f0599685e4a0d986b7c0ed3c96951efab512

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - nomad-lab >=1.3.6.dev1

tests:
  - python:
      imports:
        - runschema
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Run schema plugin for NOMAD.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/nomad-coe/nomad-schema-plugin-run

extra:
  recipe-maintainers:
    - jan-janssen
