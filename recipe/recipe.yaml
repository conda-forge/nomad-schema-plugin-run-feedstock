schema_version: 1

context:
  name: nomad-schema-plugin-run
  version: "1.0.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_schema_plugin_run-${{ version }}.tar.gz
  sha256: 44c13a46b77f6a1d32f08826aaf2d5b079f48b973929ca384da411b4a7f1e531

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - nomad-lab >=1.3.6.dev1

tests:
  - python:
      imports:
        - runschema
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Run schema plugin for NOMAD.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/nomad-coe/nomad-schema-plugin-run

extra:
  recipe-maintainers:
    - jan-janssen
